services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: bird_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bird
      RABBITMQ_DEFAULT_PASS: birdpass
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8001:8001"
    environment:
      RABBITMQ: amqp://bird:birdpass@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  host:
    build:
      context: .
      dockerfile: Dockerfile.host
    ports:
      - "8000:8000"
    environment:
      RABBITMQ: amqp://bird:birdpass@rabbitmq:5672/
    volumes:
      - host_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbit_data:
  host_data: